name: Download TrustPositif Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WireGuard and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools curl jq gzip

      - name: Setup VPN (Indonesia)
        env:
          WG_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          # Cek secret
          if [ -z "$WG_CONFIG" ]; then
            echo "❌ ERROR: WIREGUARD_CONFIG secret not set!"
            exit 1
          fi
          
          # Setup WireGuard
          echo "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          
          echo "🔄 Starting WireGuard VPN..."
          sudo wg-quick up wg0
          sleep 5
          
          # Cek IP
          VPN_IP=$(curl -s --max-time 10 ifconfig.me || echo "FAILED")
          echo "📡 Current IP: $VPN_IP"
          
          if [ "$VPN_IP" != "FAILED" ]; then
            COUNTRY=$(curl -s --max-time 10 "http://ip-api.com/json/$VPN_IP" | jq -r '.country // "Unknown"')
            echo "📍 Country: $COUNTRY"
          fi
          
          echo "✅ VPN connected!"

      - name: Download and compress data
        run: |
          mkdir -p data
          
          echo "📥 Downloading domains..."
          curl -L --max-time 60 --connect-timeout 15 -o data/domains \
            https://trustpositif.komdigi.go.id/assets/db/domains || exit 1
          
          echo "📥 Downloading domains_isp..."
          curl -L --max-time 60 --connect-timeout 15 -o data/domains_isp \
            https://trustpositif.komdigi.go.id/assets/db/domains_isp || exit 1
          
          echo "📊 Original size:"
          du -h data/domains data/domains_isp
          
          echo "🗜️ Compressing with gzip..."
          gzip -9 data/domains
          gzip -9 data/domains_isp
          
          echo "📊 Compressed size:"
          du -h data/domains.gz data/domains_isp.gz

      - name: Validate compressed files
        run: |
          for file in data/domains.gz data/domains_isp.gz; do
            if [ ! -s "$file" ]; then
              echo "❌ ERROR: $file is empty!"
              exit 1
            fi
            if ! gunzip -t "$file"; then
              echo "❌ ERROR: $file is corrupted!"
              exit 1
            fi
          done
          echo "✅ All files validated!"

      - name: Notify Telegram after validation
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          DOMAINS_SIZE=$(du -h data/domains.gz | cut -f1)
          DOMAINS_COUNT=$(gzip -cd data/domains.gz | wc -l | tr -d ' ')
          ISP_SIZE=$(du -h data/domains_isp.gz | cut -f1)
          ISP_COUNT=$(gzip -cd data/domains_isp.gz | wc -l | tr -d ' ')
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MESSAGE=$(printf '✅ VALIDASI DATA BERHASIL\n━━━━━━━━━━━━━━━━━━\n📥 Download, kompresi, dan validasi selesai\n\n📦 domains.gz: %s (%s baris)\n📦 domains_isp.gz: %s (%s baris)\n\n📁 Repository: %s\n🌿 Branch: %s\n⚙️ Workflow: %s\n🎯 Pemicu: %s\n👤 Aktor: %s\n🕒 Waktu: %s\n🔢 Run: #%s (percobaan %s)\n\n🔗 %s' "$DOMAINS_SIZE" "$DOMAINS_COUNT" "$ISP_SIZE" "$ISP_COUNT" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_WORKFLOW" "$GITHUB_EVENT_NAME" "$GITHUB_ACTOR" "$TIMESTAMP" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$RUN_URL")
          curl --fail --silent --show-error --retry 3 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true"

      - name: Auto commit and push
        id: auto_commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f data/

          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No changes detected. Skipping commit."
          else
            echo "📝 Committing changes..."
            git commit -m "🔄 Auto-update TrustPositif data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Changes pushed successfully!"
          fi

      - name: Notify Telegram after push
        if: steps.auto_commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=%s)
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')
          TOTAL_SIZE=$(du -ch data/domains.gz data/domains_isp.gz | tail -1 | cut -f1)
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MESSAGE=$(printf '🚀 UPDATE REPOSITORY BERHASIL\n━━━━━━━━━━━━━━━━━━\n✅ Data terbaru berhasil di-commit dan di-push\n\n📁 Repository: %s\n🌿 Branch tujuan: main\n🔖 Commit: %s\n📝 Pesan: %s\n📄 File berubah: %s\n💾 Total ukuran data: %s\n\n⚙️ Workflow: %s\n🎯 Pemicu: %s\n👤 Aktor: %s\n🕒 Waktu: %s\n🔢 Run: #%s (percobaan %s)\n\n🔗 %s' "$GITHUB_REPOSITORY" "$COMMIT_SHA" "$COMMIT_MESSAGE" "$CHANGED_FILES" "$TOTAL_SIZE" "$GITHUB_WORKFLOW" "$GITHUB_EVENT_NAME" "$GITHUB_ACTOR" "$TIMESTAMP" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$RUN_URL")
          curl --fail --silent --show-error --retry 3 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true"

      - name: Cleanup VPN
        if: always()
        run: |
          sudo wg-quick down wg0 2>/dev/null || echo "VPN already disconnected"
